<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#171918">
  <title>Adam Jakubowski — Project Management</title>
  <link rel="icon" href="assets/logo-aj.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="content.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<div class="scroll-progress" aria-hidden="true"></div>
<header class="nav">
  <a class="brand" href="#top" aria-label="Home"><img src="assets/logo-aj.svg" alt="AJ"><span><b>ADAM JAKUBOWSKI</b><small>PROJECT DIRECTION</small></span></a>
  <button class="menu" type="button" aria-expanded="false">Menu</button>
  <nav>
    <a data-i18n="navAbout" href="#o-mnie"></a><a data-i18n="navScope" href="#zakres"></a><a data-i18n="navProjects" href="#projekty"></a>
    <div class="languages" aria-label="Language"><button data-lang="pl">PL</button><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
    <a class="nav-cta" data-i18n="navContact" href="#kontakt"></a>
  </nav>
</header>
<main id="top">
  <section class="hero">
    <div class="hero-copy reveal"><p class="eyebrow" id="eyebrow"></p><h1 id="heroTitle"></h1><p class="lead" id="heroLead"></p><div class="actions"><a class="button primary" data-i18n="heroCta" href="#kontakt"></a><a class="button ghost" data-i18n="heroSecondary" href="#projekty"></a></div></div>
    <figure class="hero-visual reveal" data-parallax><img src="assets/hero-render.svg" alt="Architectural interior visualization"><figcaption>PROJECT / DETAIL / DELIVERY</figcaption></figure>
    <div class="hero-meta"><span>PL / EN / DE</span><span data-i18n="heroMeta"></span><span>EUROPE</span></div>
  </section>

  <section class="statement reveal"><p data-i18n="statementSmall"></p><h2 data-i18n="statement"></h2></section>
  <section class="about grid-section" id="o-mnie"><div><p class="section-no" data-section="about"></p><p class="side-note" data-i18n="aboutSide"></p></div><div class="reveal"><h2 id="aboutTitle"></h2><div id="aboutText" class="about-copy"></div><div class="facts" id="facts"></div></div></section>
  <section class="services grid-section dark" id="zakres"><div><p class="section-no" data-section="scope"></p><p class="muted" data-i18n="scopeSide"></p></div><div id="services"></div></section>
  <section class="projects" id="projekty"><div class="project-head"><div><p class="section-no" data-section="projects"></p><h2 data-i18n="projectsTitle"></h2></div><p data-i18n="projectsIntro"></p></div><div class="project-grid" id="projectGrid"></div><p class="disclaimer" data-i18n="renderDisclaimer"></p></section>
  <section class="process grid-section"><div><p class="section-no" data-section="process"></p></div><div class="steps" id="steps"></div></section>
  <section class="contact" id="kontakt"><div class="contact-layout"><div class="contact-copy reveal"><p class="section-no" data-section="contact"></p><h2 data-i18n="contactTitle"></h2><p data-i18n="contactIntro"></p><a id="emailLink" class="email" href="mailto:info@adam-jakubowski.com">info@adam-jakubowski.com</a><div class="contact-meta"><span data-i18n="location"></span><span data-i18n="availability"></span></div></div><form id="contactForm" class="contact-form"><label><span data-i18n="formName"></span><input name="name" autocomplete="name" required></label><label><span data-i18n="formEmail"></span><input name="email" type="email" autocomplete="email" required></label><label><span data-i18n="formSubject"></span><input name="subject" required></label><label><span data-i18n="formMessage"></span><textarea name="message" rows="6" required></textarea></label><button class="button primary" type="submit" data-i18n="formSend"></button><small data-i18n="formNote"></small></form></div></section>
</main>
<footer><span id="footerName"></span><span data-i18n="footerRole"></span><a data-i18n="backTop" href="#top"></a></footer>
</body>
</html>
